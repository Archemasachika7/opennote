name: Build apps

# Builds the web app, the Android APK and the Windows installer on every push to master.
# Tagging a version (git tag v0.2.0 && git push --tags) also publishes them on a GitHub Release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc -p .
      - run: npx vitest run
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      # The Android SDK comes preinstalled on ubuntu-latest (ANDROID_HOME is set);
      # android-actions/setup-android@v3 broke because it asks for the removed 'tools' package.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # The release key lives only in GitHub Secrets. Pull requests from forks don't get secrets, so they
      # build with a throwaway debug key; a tagged release must never ship that.
      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/opennote-release.jks"
            echo "OPENNOTE_KEYSTORE_FILE=$RUNNER_TEMP/opennote-release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release APK must be signed with the release key"; exit 1
          else
            echo "::warning::No release key; this APK is signed with a throwaway debug key and won't update a published install"
          fi
      - name: Build APK
        working-directory: android
        env:
          OPENNOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENNOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENNOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/opennote-release.jks"
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk OpenNote-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: OpenNote-android, path: OpenNote-android.apk }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build
      - name: Collect installer
        shell: pwsh
        run: Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName OpenNote-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: OpenNote-windows, path: OpenNote-windows-setup.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The apps read their version from package.json; a tag that disagrees would publish mislabelled builds.
      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} but package.json says $v; bump package.json first"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenNote-android.apk
            OpenNote-windows-setup.exe
          generate_release_notes: true
