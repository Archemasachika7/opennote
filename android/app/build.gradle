apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// One version for every platform: package.json. versionCode = major*10000 + minor*100 + patch, so each release installs over the last.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def (vMaj, vMin, vPat) = appVersion.tokenize('.-')[0..2].collect { it as int }

android {
    namespace = "app.opennote.notes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.opennote.notes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMaj * 10000 + vMin * 100 + vPat
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Published APKs are signed with a private release key that is never committed. CI writes it from
    // GitHub Secrets and passes these four environment variables. Without them (a local build, or a pull
    // request from a fork) Gradle falls back to the machine's own debug key: that APK runs, but Android
    // won't install it over a published one, which is exactly what keeps updates trustworthy.
    def releaseStore = System.getenv('OPENNOTE_KEYSTORE_FILE')
    def hasReleaseKey = releaseStore && file(releaseStore).exists()
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('OPENNOTE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OPENNOTE_KEY_ALIAS')
                keyPassword System.getenv('OPENNOTE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (hasReleaseKey) signingConfig signingConfigs.release
            // `./gradlew assembleDebug -PinkLab`: a test build that installs next to the real app
            // (its own data, so trying the native ink layer can never touch real notes)
            if (project.hasProperty('inkLab')) applicationIdSuffix '.inklab'
        }
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Jetpack Ink 1.0.0 (stable): low-latency native active stroke for a stylus, see NativeInkPlugin.kt
    implementation "androidx.ink:ink-authoring:1.0.0"
    implementation "androidx.ink:ink-brush:1.0.0"
    implementation "androidx.ink:ink-strokes:1.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Kotlin compiles to the same bytecode level as the Java code (capacitor.build.gradle: Java 21)
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21) }
}
